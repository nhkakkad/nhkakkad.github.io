<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Deep teal-navy background gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#1a2e3a"/>
      <stop offset="100%" stop-color="#0d1820"/>
    </radialGradient>

    <!-- Glow for the neural pulse -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <circle cx="32" cy="32" r="31" fill="url(#bgGrad)"/>
  <circle cx="32" cy="32" r="31" fill="none" stroke="#2a7a8a" stroke-width="0.8" opacity="0.6"/>

  <!-- Subtle inner ring pulse -->
  <circle cx="32" cy="32" r="27" fill="none" stroke="#3ab8cc" stroke-width="0.4" opacity="0">
    <animate attributeName="opacity" values="0;0.25;0" dur="3s" repeatCount="indefinite" begin="0.5s"/>
    <animate attributeName="r" values="22;29;22" dur="3s" repeatCount="indefinite" begin="0.5s"/>
  </circle>

  <!-- === FIGURE: White coat silhouette === -->
  <!-- Neck/collar area -->
  <path d="M28 26 L28 31 L32 34 L36 31 L36 26" fill="#c8d8e0" opacity="0.95"/>

  <!-- Left lapel of white coat -->
  <path d="M28 31 L20 38 L20 52 L32 52 L32 34 Z" fill="#d8e8f0" opacity="0.9"/>

  <!-- Right lapel of white coat -->
  <path d="M36 31 L44 38 L44 52 L32 52 L32 34 Z" fill="#ccdce8" opacity="0.9"/>

  <!-- Dark shirt underneath — center strip -->
  <path d="M30 33 L30 52 L34 52 L34 33 L32 35 Z" fill="#2a3a44" opacity="0.9"/>

  <!-- Head shape -->
  <ellipse cx="32" cy="20" rx="7.5" ry="8.5" fill="#d4a882" opacity="0.95"/>

  <!-- Hair -->
  <path d="M24.5 17 Q25 11 32 10.5 Q39 11 39.5 17 Q37 14 32 13.8 Q27 14 24.5 17Z" fill="#1a1208"/>

  <!-- === GLASSES — the key identity mark === -->
  <!-- Left lens frame -->
  <rect x="23.5" y="17.5" width="7" height="5" rx="2" ry="2"
        fill="none" stroke="#1a2830" stroke-width="1.1"/>
  <!-- Right lens frame -->
  <rect x="33.5" y="17.5" width="7" height="5" rx="2" ry="2"
        fill="none" stroke="#1a2830" stroke-width="1.1"/>
  <!-- Bridge -->
  <line x1="30.5" y1="20" x2="33.5" y2="20" stroke="#1a2830" stroke-width="0.9"/>
  <!-- Left temple -->
  <line x1="23.5" y1="20" x2="21" y2="19.5" stroke="#1a2830" stroke-width="0.9"/>
  <!-- Right temple -->
  <line x1="40.5" y1="20" x2="43" y2="19.5" stroke="#1a2830" stroke-width="0.9"/>

  <!-- Lens highlight glint -->
  <ellipse cx="27" cy="19" rx="1.2" ry="0.7" fill="white" opacity="0.25"/>
  <ellipse cx="37" cy="19" rx="1.2" ry="0.7" fill="white" opacity="0.25"/>

  <!-- === NEURAL / MIND MOTIF — top of head === -->
  <!-- Brain curve, minimal and elegant -->
  <path d="M29 11.5 Q27 9 28.5 7.5 Q30 6 31 8 Q32 6 33.5 7.5 Q35 9 33 11.5"
        fill="none" stroke="#3ab8cc" stroke-width="0.9" stroke-linecap="round" filter="url(#glow)">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2.4s" repeatCount="indefinite"/>
  </path>
  <!-- Synapse dots -->
  <circle cx="29" cy="11.5" r="0.8" fill="#3ab8cc" filter="url(#glow)">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite" begin="0s"/>
  </circle>
  <circle cx="33" cy="11.5" r="0.8" fill="#3ab8cc" filter="url(#glow)">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite" begin="0.4s"/>
  </circle>
  <circle cx="31" cy="8" r="0.6" fill="#7adce8" filter="url(#glow)">
    <animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.4s" repeatCount="indefinite" begin="0.8s"/>
  </circle>

  <!-- === EKG / Heartbeat line — bottom strip === -->
  <!-- Represents the "pulse of mind" — psychiatry's clinical + human side -->
  <polyline
    points="14,57 19,57 21,54 23,60 25,52 27,57 37,57 39,54 41,60 43,52 45,57 50,57"
    fill="none" stroke="#3ab8cc" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"
    filter="url(#glow)">
    <animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.8s" repeatCount="indefinite"/>
    <animate attributeName="stroke-dashoffset" values="80;0;-80" dur="2.8s" repeatCount="indefinite"/>
  </polyline>
  <!-- Dashed for traveling effect -->
  <polyline
    points="14,57 19,57 21,54 23,60 25,52 27,57 37,57 39,54 41,60 43,52 45,57 50,57"
    fill="none" stroke="#3ab8cc" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"
    stroke-dasharray="80" stroke-dashoffset="80" opacity="0.9" filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" values="80;-80" dur="2.4s" repeatCount="indefinite" calcMode="linear"/>
  </polyline>

</svg>
